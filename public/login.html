<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enterprise Portal Login | Extreme Sales &amp; Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            min-height: 100vh;
            transition: background 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
        body.role-admin {
            background: radial-gradient(circle at 10% 20%, #1e3a8a 0%, #0f172a 60%, #020617 100%);
        }
        body.role-staff {
            background: radial-gradient(circle at 10% 20%, #064e3b 0%, #062c26 60%, #021a15 100%);
        }
        body.role-technician {
            background: radial-gradient(circle at 10% 20%, #78350f 0%, #451a03 60%, #1c0a00 100%);
        }
        .portal-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1);
        }
    </style>
    <!-- Anti-flicker: apply dark class BEFORE first paint -->
    <script>
      (function(){
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e){}
      })();
    </script></head>
<body class="role-admin flex items-center justify-center min-h-screen p-4 sm:p-6 text-gray-900 font-sans antialiased relative overflow-hidden">

    <!-- Ambient Glowing Orbs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-blue-500/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-purple-500/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10">

        <!-- Top Branding -->
        <div class="text-center mb-6">
            <a href="index.html" class="inline-flex items-center gap-2 text-white hover:opacity-90 transition group">
                <span class="bg-blue-600 text-white w-9 h-9 rounded-xl flex items-center justify-center font-black text-base shadow-lg shadow-blue-500/30 group-hover:scale-105 transition">ES</span>
                <span class="text-2xl font-black tracking-tight">Extreme <span class="text-blue-400">S&amp;S</span></span>
            </a>
            <p class="text-xs uppercase tracking-widest font-bold text-gray-400 mt-1">Enterprise Operations Portal</p>
        </div>

        <!-- Card Container -->
        <div class="portal-card rounded-3xl p-6 sm:p-8">

            <!-- Role Selector Tabs -->
            <div class="mb-6">
                <p class="text-[11px] font-extrabold uppercase tracking-wider text-gray-500 mb-2">Select Your Access Portal</p>
                <div class="flex p-1 bg-gray-100 rounded-xl gap-1">
                    <button type="button" onclick="setRole('admin', this)" class="role-tab active flex-1 py-2 text-xs font-bold rounded-lg text-gray-700 transition flex items-center justify-center gap-1.5 bg-blue-600 text-white shadow-sm">
                        <span>🛡️</span> Admin
                    </button>
                    <button type="button" onclick="setRole('staff', this)" class="role-tab flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center justify-center gap-1.5">
                        <span>📋</span> Staff
                    </button>
                    <button type="button" onclick="setRole('technician', this)" class="role-tab flex-1 py-2 text-xs font-bold rounded-lg text-gray-600 hover:text-gray-900 transition flex items-center justify-center gap-1.5">
                        <span>🧑‍🔧</span> Field Tech
                    </button>
                </div>
            </div>

            <!-- Portal Badge Header -->
            <div class="flex items-center justify-between pb-4 mb-4 border-b border-gray-100">
                <div>
                    <h1 id="portalTitle" class="text-xl font-extrabold text-gray-900">Admin Control Center</h1>
                    <p id="portalSubtitle" class="text-xs text-gray-500 mt-0.5">Manage full fleet, analytics, inventory &amp; AMCs</p>
                </div>
                <span id="roleBadge" class="bg-blue-100 text-blue-800 text-[10px] font-black uppercase tracking-wider px-2.5 py-1 rounded-full">
                    Admin
                </span>
            </div>

            <!-- Demo Quick Login Chips -->
            <div class="mb-5 bg-gray-50 border border-gray-200/80 rounded-xl p-3">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[10px] font-extrabold uppercase tracking-wider text-gray-500 flex items-center gap-1">
                        <span>⚡</span> 1-Click Quick Demo Login
                    </span>
                    <span class="text-[10px] text-gray-400">Pre-fills role</span>
                </div>
                <div class="grid grid-cols-3 gap-1.5">
                    <button type="button" onclick="quickFillLogin('admin')" class="bg-white hover:bg-blue-50 hover:border-blue-300 border border-gray-200 text-blue-700 text-xs font-bold py-1.5 px-2 rounded-lg transition shadow-2xs text-center">
                        🛡️ Admin
                    </button>
                    <button type="button" onclick="quickFillLogin('staff')" class="bg-white hover:bg-emerald-50 hover:border-emerald-300 border border-gray-200 text-emerald-700 text-xs font-bold py-1.5 px-2 rounded-lg transition shadow-2xs text-center">
                        📋 Staff
                    </button>
                    <button type="button" onclick="quickFillLogin('technician')" class="bg-white hover:bg-amber-50 hover:border-amber-300 border border-gray-200 text-amber-700 text-xs font-bold py-1.5 px-2 rounded-lg transition shadow-2xs text-center">
                        🧑‍🔧 Tech
                    </button>
                </div>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <input type="hidden" id="selectedRole" value="admin">

                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-1">Email Address</label>
                    <div class="relative">
                        <input
                            type="email"
                            id="email"
                            required
                            autocomplete="username"
                            placeholder="admin@extremess.com"
                            value="admin@extremess.com"
                            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition"
                        >
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1">
                        <label for="password" class="block text-xs font-bold text-gray-700 uppercase tracking-wider">Password</label>
                        <button type="button" onclick="togglePasswordVisibility()" class="text-xs text-blue-600 hover:text-blue-800 font-medium">Show/Hide</button>
                    </div>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            required
                            autocomplete="current-password"
                            placeholder="••••••••"
                            value="admin123"
                            class="w-full bg-gray-50 border border-gray-300 rounded-xl px-4 py-2.5 text-sm text-gray-900 focus:ring-2 focus:ring-blue-500 focus:bg-white focus:outline-none transition font-mono"
                        >
                    </div>
                </div>

                <!-- Error Message Banner -->
                <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded-lg text-xs font-medium"></div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="loginBtn"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl shadow-lg shadow-blue-500/25 hover:shadow-blue-500/40 transition transform active:scale-[0.98] flex items-center justify-center gap-2"
                >
                    <span>Sign In to Portal</span>
                    <span>→</span>
                </button>
            </form>

            <div class="mt-6 pt-4 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                <a href="index.html" class="hover:text-gray-900 font-medium transition">← Return to Website</a>
                <a href="status.html" class="hover:text-blue-600 font-medium transition">Track Service GPS</a>
            </div>

        </div>

        <p class="text-center text-xs text-gray-500 mt-6">
            🔒 Secure 256-bit encrypted authentication. Authorized personnel only.
        </p>

    </div>

    <!-- SCRIPTS -->
    <script src="js/config.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
