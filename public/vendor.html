<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Partner Portal | Extreme Sales &amp; Services</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <!-- Anti-flicker: apply dark class ONLY if explicitly saved as dark -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          if (saved === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body
    class="bg-[#F2EDE3] dark:bg-[#1A1412] text-[#342C27] dark:text-[#F2EDE3] min-h-screen font-sans antialiased selection:bg-[#B86E4B] selection:text-white transition-colors duration-200"
  >
    <!-- TOP NAVIGATION BAR -->
    <header
      class="bg-linear-to-r from-[#27211D] via-[#342C27] to-[#3D342F] text-white sticky top-0 z-50 shadow-md border-b border-[#B8AA98]/30 backdrop-blur-md"
    >
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16">
          <div class="flex items-center gap-3">
            <div
              class="w-9 h-9 bg-[#A05B3A] text-white rounded-xl flex items-center justify-center shadow-[0_2px_8px_rgba(160,91,58,0.35)]"
            >
              <svg
                class="w-5 h-5 text-white"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"
                />
              </svg>
            </div>
            <div>
              <span class="text-lg font-black tracking-tight text-white"
                >Extreme S&amp;S
                <span
                  class="text-[#E4C99A] font-bold text-xs bg-[#E4C99A]/15 px-2.5 py-0.5 rounded-full border border-[#E4C99A]/30"
                  >Vendor Portal</span
                ></span
              >
              <div class="flex items-center gap-1.5 text-[11px] text-[#B8AA98]">
                <span
                  class="w-2 h-2 rounded-full bg-[#77B89A] animate-pulse"
                ></span>
                <span>Verified Supplier &amp; Equipment Channel</span>
              </div>
            </div>
          </div>

          <div class="flex gap-2.5 items-center">
            <a
              href="products.html"
              target="_blank"
              rel="noopener noreferrer"
              class="hidden sm:inline-flex text-[#B8AA98] hover:text-white text-xs font-semibold px-3 py-1.5 rounded-lg hover:bg-white/10 transition items-center gap-1"
            >
              <span>Public Store</span>
              <span class="text-xs">↗</span>
            </a>
            <button
              type="button"
              class="theme-toggle-btn text-[#B8AA98] hover:text-white transition p-2 rounded-lg hover:bg-white/10"
              aria-label="Toggle Theme"
            >
              <svg
                class="theme-icon-moon w-5 h-5"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
                />
              </svg>
              <svg
                class="theme-icon-sun w-5 h-5 hidden text-[#E4C99A]"
                fill="none"
                stroke="currentColor"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2.5"
                  d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707m12.728 0l-.707-.707M6.343 6.343l-.707-.707M14 12a2 2 0 11-4 0 2 2 0 014 0z"
                />
              </svg>
            </button>
            <button
              type="button"
              id="refreshBtn"
              class="bg-[#A05B3A] hover:bg-[#944E2E] text-white px-3.5 py-1.5 rounded-xl font-bold text-xs shadow-[0_2px_10px_rgba(160,91,58,0.3)] transition flex items-center gap-1.5 cursor-pointer"
            >
              <span id="refreshIcon" class="inline-block transition">↻</span>
              <span>Sync Catalog</span>
            </button>
            <button
              type="button"
              onclick="handleVendorLogout()"
              class="bg-[#A05B3A]/20 hover:bg-[#A05B3A] text-[#E4C99A] hover:text-white border border-[#A05B3A]/40 px-3 py-1.5 rounded-xl font-bold text-xs transition cursor-pointer"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-16">
      <section class="bg-white/80 dark:bg-[#27211D] border border-[#B8AA98]/40 rounded-2xl p-8 shadow-sm">
        <h1 class="text-2xl font-bold mb-3">Seller portal is coming soon</h1>
        <p class="text-sm text-[#655448] dark:text-[#B8AA98] mb-6">
          We're building a new marketplace where approved dealers can list <strong>new air conditioners</strong> on Extreme Sales &amp; Services.
          Seller sign-up will open here once it's ready.
        </p>
        <a href="contact.html" class="inline-flex items-center px-5 py-2.5 rounded-xl bg-[#A05B3A] text-white text-sm font-bold">Contact us about selling</a>
      </section>
    </main>

    <div
      id="toastContainer"
      class="fixed bottom-6 right-6 z-50 space-y-2 pointer-events-none"
    ></div>

  </body>
</html>
