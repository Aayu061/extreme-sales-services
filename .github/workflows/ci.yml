name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Syntax verification
      run: |
        node -c server.js
        node -c server/middleware/authMiddleware.js
        node -c server/middleware/security.js
        node -c server/services/dispatchEngine.js
        node -c server/services/diagnosticsEngine.js
        node -c server/services/emailService.js

    - name: Run automated test suite
      run: npm test
      env:
        JWT_SECRET: ci_test_jwt_secret_token_123456789
