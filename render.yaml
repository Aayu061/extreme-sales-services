services:
  - type: web
    name: extreme-sales-services
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: BUSINESS_NAME
        value: "Extreme AC Sales & Services"
      - key: BUSINESS_EMAIL
        value: "extremess0121@gmail.com"
      - key: APP_URL
        value: "https://extreme-sales-services.vercel.app"
      - key: PYS_API_BASE_URL
        value: "https://place-your-service-api.onrender.com/api/v1"
      - key: PYS_API_KEY
        sync: false
      - key: PYS_WEBHOOK_SECRET
        sync: false
      - key: PYS_INTEGRATION_KEY_ID
        sync: false
      - key: PYS_INTEGRATION_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
